<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b30" />
      <stop offset="1" stop-color="#101012" />
    </linearGradient>
  </defs>
  <!-- Squircle tile matching the sidebar's primary badge. -->
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#tile)" />
  <!-- The ✻ mark: three bars at 60°, drawn as one asterisk. -->
  <g fill="#fafafa" transform="translate(512 512)">
    <rect x="-285" y="-26" width="570" height="52" rx="26" />
    <rect x="-285" y="-26" width="570" height="52" rx="26" transform="rotate(60)" />
    <rect x="-285" y="-26" width="570" height="52" rx="26" transform="rotate(120)" />
  </g>
</svg>
